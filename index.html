<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculadora Simples</title>
</head>
<body>

    <form id="formulario" onsubmit="registrar(event)">
        Nome: <input type="text" id="nome" required><br><br>
        
        Nota 1: <input type="number" id="n1" step="0.1" required oninput="calcular()"><br><br>
        Nota 2: <input type="number" id="n2" step="0.1" required oninput="calcular()"><br><br>
        Nota 3: <input type="number" id="n3" step="0.1" required oninput="calcular()"><br><br>
        Nota 4: <input type="number" id="n4" step="0.1" required oninput="calcular()"><br><br>

        <h3>Média atual: <span id="visorMedia">0</span></h3>

  
        <button type="submit">Registrar resultado</button>
    </form>

    <script>
        function calcular() {
            let n1 = Number(document.getElementById('n1').value) || 0;
            let n2 = Number(document.getElementById('n2').value) || 0;
            let n3 = Number(document.getElementById('n3').value) || 0;
            let n4 = Number(document.getElementById('n4').value) || 0;
            
            let media = (n1 + n2 + n3 + n4) / 4;
            
            
            document.getElementById('visorMedia').innerText = media;
        }

     
        function registrar(event) {
            event.preventDefault(); 

           
            let nomeSalvo = document.getElementById('nome').value;

          
            let notas = [
                Number(document.getElementById('n1').value),
                Number(document.getElementById('n2').value),
                Number(document.getElementById('n3').value),
                Number(document.getElementById('n4').value)
            ];

            
            let mediaFinal = (notas[0] + notas[1] + notas[2] + notas[3]) / 4;

          
            let situacao = "";
            if (mediaFinal >= 6) {
                situacao = "APROVADO";
            } else if (mediaFinal >= 2 && mediaFinal < 6) {
                situacao = "EXAME";
            } else {
                situacao = "REPROVADO";
            }
          
            document.write("<h1>Resultado de " + nomeSalvo + "</h1>");
            document.write("<h2>" + situacao + "</h2>");
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>
    <form id="formulario" onsubmit="registrar(event)">
        Nome: <input type="text" id="nome" required><br><br>
        
        Nota 1: <input type="number" id="n1" step="0.1" required oninput="calcular()"><br><br>
        Nota 2: <input type="number" id="n2" step="0.1" required oninput="calcular()"><br><br>
        Nota 3: <input type="number" id="n3" step="0.1" required oninput="calcular()"><br><br>
        Nota 4: <input type="number" id="n4" step="0.1" required oninput="calcular()"><br><br>

        <h3>Média atual: <span id="visorMedia">0</span></h3>

        <button type="submit">Registrar resultado</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
